<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — MAHVE</title>

  <!-- پیش‌بارگذاری دامنه‌های فونت گوگل برای کاهش تأخیر اتصال (DNS/TLS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- بارگذاری فونت‌های سفارشی: Cinzel (تیترها)، Playfair Display (متن ادبی)، Inter (متن رابط) -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- فایل استایل اصلی سایت -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============================================================
       هدر / نوار ناوبری اصلی
       کلاس nav--solid یعنی هدر همیشه پس‌زمینه دارد (حالت ثابت)
  ============================================================ -->
  <header class="nav nav--solid" id="nav">
    <div class="nav__inner">

      <!-- لوگوی برند که به صفحه اصلی بازمی‌گردد -->
      <a href="index.html" class="nav__logo">MAHVE</a>

      <!-- منوی لینک‌های اصلی سایت -->
      <nav class="nav__links">
        <a href="index.html" class="nav__link">Home</a>
        <a href="products.html" class="nav__link">Collections</a>
        <a href="index.html#story" class="nav__link">Story</a>
        <a href="index.html#craft" class="nav__link">Craftsmanship</a>
        <a href="index.html#contact" class="nav__link">Contact</a>
        <a href="admin.html" class="nav__link">Admin</a>
      </nav>

      <!-- دکمه‌های کنشی سمت راست هدر -->
      <div class="nav__actions">

        <!-- دکمه علاقه‌مندی‌ها + شمارنده تعداد آیتم‌ها (با جاوااسکریپت به‌روزرسانی می‌شود) -->
        <button class="nav__icon" id="wishlistBtn" aria-label="Wishlist">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>
          <span class="badge" id="wishlistCount">0</span>
        </button>

        <!-- دکمه سبد خرید + شمارنده تعداد آیتم‌ها (با جاوااسکریپت به‌روزرسانی می‌شود) -->
        <button class="nav__icon" id="cartBtn" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          <span class="badge" id="cartCount">0</span>
        </button>

        <!-- دکمه منوی همبرگری مخصوص نمایشگرهای موبایل -->
        <button class="nav__toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <!-- ============================================================
       محتوای اصلی صفحه جزئیات محصول
  ============================================================ -->
  <main class="product-page">
    <div class="container">

      <!-- لینک بازگشت به صفحه لیست محصولات -->
      <a href="products.html" class="product-page__back">← Back to Collections</a>

      <!--
        ظرف نمایش جزئیات محصول.
        محتوای این بخش به‌صورت داینامیک توسط script.js
        (بر اساس پارامتر URL یا شناسه محصول) پر می‌شود.
      -->
      <div class="product-page__grid" id="productDetail"></div>
    </div>
  </main>

  <!-- ============================================================
       فوتر سایت
  ============================================================ -->
  <footer class="footer">
    <div class="container footer__bottom">
      <span>© 2026 MAHVE. All rights reserved.</span>
      <span>Beauty for today. A legacy for eternity.</span>
    </div>
  </footer>

  <!-- ============================================================
       لایه تاریک پشت کشوها (Overlay)
       با کلیک روی آن، کشوهای سبد خرید/علاقه‌مندی بسته می‌شوند.
  ============================================================ -->
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <!-- ============================================================
       کشوی کناری سبد خرید (Cart Drawer)
  ============================================================ -->
  <aside class="drawer" id="cartDrawer">

    <!-- سربرگ کشو: عنوان + دکمه بستن (data-close برای هندل کلیک در JS) -->
    <div class="drawer__head"><h3>Your Cart</h3><button class="drawer__close" data-close>&times;</button></div>

    <!-- نوار پیشرفت ارسال رایگان: متن وضعیت + نوار پیشرفت -->
    <div class="shipping-bar">
      <p class="shipping-bar__text" id="shippingText">You're $10,000 away from free shipping</p>
      <div class="shipping-bar__track"><span class="shipping-bar__fill" id="shippingFill"></span></div>
    </div>

    <!-- بدنه کشو: لیست آیتم‌های سبد خرید (داینامیک با JS) -->
    <div class="drawer__body" id="cartItems"></div>

    <!-- پایین کشو: نمایش جمع کل + دکمه رفتن به صفحه پرداخت -->
    <div class="drawer__foot">
      <div class="drawer__total"><span>Total</span><strong id="cartTotal">$0</strong></div>
      <a href="checkout.html" class="btn btn--gold btn--full">Checkout</a>
    </div>
  </aside>

  <!-- ============================================================
       کشوی کناری علاقه‌مندی‌ها (Wishlist Drawer)
  ============================================================ -->
  <aside class="drawer" id="wishlistDrawer">
    <div class="drawer__head"><h3>Wishlist</h3><button class="drawer__close" data-close>&times;</button></div>

    <!-- بدنه کشو: لیست آیتم‌های علاقه‌مندی (داینامیک با JS) -->
    <div class="drawer__body" id="wishlistItems"></div>
  </aside>

  <!-- ============================================================
       اعلان کوتاه (Toast)
       برای نمایش پیام‌هایی مثل «به سبد اضافه شد» استفاده می‌شود.
  ============================================================ -->
  <div class="toast" id="toast"></div>

  <!-- فایل اسکریپت اصلی سایت (مدیریت سبد، علاقه‌مندی، فیلترها و رندر محصول) -->
  <script src="script.js"></script>
</body>
</html>
